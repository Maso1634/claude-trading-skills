# Trading dashboard. Run from this folder:  docker compose up -d --build
# The repo's reports/ and state/ folders are mounted read-only into the web app.
# Writable: trade-journal/ (journal SQLite + screenshots) and state/theses/ (New thesis page).

services:
  dashboard:
    build: .
    image: trading-dashboard:local
    container_name: trading-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      REPORTS_DIR: /data/reports
      STATE_DIR: /data/state
      JOURNAL_DIR: /data/journal
      SKILLS_DIR: /repo/skills
      THESES_DIR: /data/state/theses
    ports:
      - "8080:8080"
    volumes:
      - ../reports:/data/reports:ro
      - ../state:/data/state:ro
      - ../state/theses:/data/state/theses
      - ../trade-journal:/data/journal
      - ../skills:/repo/skills:ro
    read_only: true
    tmpfs:
      - /tmp

  # Interactive Brokers (IBKR) IB Gateway, with IBC to log in and restart it daily.
  # Off unless COMPOSE_PROFILES=ibkr is in .env. Login details live in ibkr.env
  # (git-ignored, chmod 600), so the dashboard container never sees the password.
  # No "ports:" on purpose: only containers in this Compose project can reach the
  # API (4004 paper, 4003 live), so nothing else on the network can.
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable   # pin a version tag once tested
    container_name: ib-gateway
    profiles: ["ibkr"]
    restart: unless-stopped
    env_file: ibkr.env
    environment:
      TRADING_MODE: paper
      READ_ONLY_API: "yes"             # the API can read data but never place orders
      TIME_ZONE: America/New_York
      AUTO_RESTART_TIME: "11:59 PM"    # daily restart without a new login
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"

  # One-shot job that writes fresh market reports. Started by cron:
  #   docker compose run --rm refresh
  refresh:
    image: trading-dashboard:local
    profiles: ["refresh"]
    env_file: .env
    working_dir: /repo
    entrypoint: ["sh", "/app/refresh_market.sh"]
    volumes:
      - ../skills:/repo/skills:ro
      - ../reports:/repo/reports
      - ../state/theses:/repo/state/theses:ro
